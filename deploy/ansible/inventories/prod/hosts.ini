# ============================================================
# ITSM_ops 物理机部署清单
# 部署工程师只需修改此文件即可
# ============================================================

# --- 后端 API 服务器（可多台，负载均衡）---
[backend]
192.168.1.10 ansible_user=root
# 192.168.1.11 ansible_user=root

# --- 前端 Web 服务器（Nginx 承载静态文件）---
[frontend]
192.168.1.20 ansible_user=root
# 192.168.1.21 ansible_user=root

# --- 采集器节点（每台被监控设备或跳板机部署一个）---
[collector]
192.168.1.10 ansible_user=root
192.168.1.30 ansible_user=root
# 192.168.1.31 ansible_user=root

# ============================================================
# 全局变量（也可以在 group_vars/all.yml 中配置）
# ============================================================
[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_env=production
