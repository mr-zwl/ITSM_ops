global:
  imageRegistry: ""

backend:
  image:
    repository: itsm-ops/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image:
    repository: itsm-ops/frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

collector:
  image:
    repository: itsm-ops/collector
    tag: latest
    pullPolicy: IfNotPresent
  interval: 60
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

config:
  appEnv: production
  appPort: "8080"
  logLevel: info
  dbType: mysql
  dbHost: mysql
  dbPort: "3306"
  dbName: itsm_ops

secrets:
  dbUser: itsm
  dbPassword: changeme
  jwtSecret: changeme-to-random-string
  collectorToken: changeme

ingress:
  enabled: true
  className: nginx
  host: itsm.example.com
  tls: false
