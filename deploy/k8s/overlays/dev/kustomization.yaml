apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namePrefix: dev-
patches:
  - target:
      kind: Deployment
      name: itsm-backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: itsm-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: itsm-config
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: development
      - op: replace
        path: /data/APP_LOG_LEVEL
        value: debug
