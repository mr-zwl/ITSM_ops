apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsm-backend
  labels:
    app.kubernetes.io/name: itsm-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: itsm-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itsm-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: itsm-ops/backend:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: itsm-config
            - secretRef:
                name: itsm-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
