apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itsm-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - host: itsm.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: itsm-backend
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: itsm-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: itsm-frontend
                port:
                  number: 80
