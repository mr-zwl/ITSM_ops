apiVersion: apps/v1
kind: Deployment
metadata:
  name: itsm-frontend
  labels:
    app.kubernetes.io/name: itsm-frontend
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: itsm-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itsm-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: itsm-ops/frontend:latest
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
