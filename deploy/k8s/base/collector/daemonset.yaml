apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: itsm-collector
  labels:
    app.kubernetes.io/name: itsm-collector
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: itsm-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itsm-collector
        app.kubernetes.io/component: collector
    spec:
      containers:
        - name: collector
          image: itsm-ops/collector:latest
          env:
            - name: COLLECTOR_ENDPOINT
              value: http://itsm-backend:8080/api/v1/collect
            - name: COLLECTOR_INTERVAL
              value: "60"
          envFrom:
            - secretRef:
                name: itsm-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
